<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하이빅쌤 영어 완강 플래너</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3f51b5">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-bar">
    <div class="app-bar-title">
      <span class="icon">🎓</span>
      <h1>하이빅쌤 영어 완강 플래너</h1>
    </div>
    <div class="app-bar-actions">
      <button id="theme-toggle-btn" class="icon-btn" aria-label="다크모드 토글" title="다크모드 전환">
        <span id="theme-icon">🌙</span>
      </button>
      <button id="pwa-install-btn" class="install-btn hidden">
        <span>📲 앱 설치</span>
      </button>
    </div>
  </header>

  <main class="main-container">

    <section class="card progress-card">
      <div class="progress-header">
        <h2>전체 학습 진행률</h2>
        <span id="progress-percent" class="percent-badge">0%</span>
      </div>
      
      <div class="progress-track">
        <div id="progress-bar-fill" class="progress-fill"></div>
      </div>
      
      <div class="progress-stats">
        <span>완료: <strong id="completed-count">0</strong> / <span id="total-count">0</span>강</span>
        <span id="remaining-count-text">남은 강의: 0강</span>
      </div>
    </section>

    <section class="card today-card">
      <div class="card-header">
        <span class="card-icon">🔥</span>
        <h3>오늘의 추천 학습</h3>
      </div>
      <div id="today-lesson-container" class="today-content"></div>
    </section>

    <section class="controls-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="강의 제목 또는 ID 검색...">
        <button id="search-clear-btn" class="clear-btn hidden">✕</button>
      </div>
      <div class="accordion-actions">
        <button id="expand-all-btn" class="text-btn">전체 펼치기</button>
        <span class="divider">|</span>
        <button id="collapse-all-btn" class="text-btn">전체 접기</button>
      </div>
    </section>

    <section id="curriculum-container" class="curriculum-container"></section>

    <section class="card memo-card">
      <div class="card-header">
        <span class="card-icon">📝</span>
        <h3>학습 메모 & 완강 다짐</h3>
      </div>
      <div class="memo-content">
        <textarea id="memo-input" placeholder="오늘 배운 주요 어휘, 복습할 내용, 완강 다짐을 기록하세요..."></textarea>
        <div class="memo-footer">
          <span id="memo-status" class="memo-status-text">자동 저장됨</span>
          <button id="save-memo-btn" class="btn btn-primary">저장하기</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 하이빅쌤 영어 완강 플래너 PWA | Offline Supported</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
